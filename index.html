<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0f"><title>Ghassan Bin Zia App Store</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f5f7fb;font-family:system-ui,Arial}.wrap{max-width:1050px;margin:auto;padding:16px}header{padding:25px 0;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#6858ff,#19c7ff);display:grid;place-items:center;font-weight:900}.title{font-size:25px;font-weight:900}.sub{color:#929bad;font-size:12px}.admin{color:#aeb6c7;border:1px solid #272d39;padding:9px 12px;border-radius:12px;text-decoration:none}.hero,.card{background:#10131b;border:1px solid #202632;border-radius:20px}.hero{padding:22px;margin-bottom:15px}.hero h2{margin:0 0 7px}.hero p{color:#aeb6c5;margin:0;line-height:1.5}.search{width:100%;margin-top:15px;background:#090c12;border:1px solid #2a3040;color:white;padding:13px;border-radius:13px}.status{color:#929bad;font-size:12px;margin:12px 2px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.card{padding:15px;min-height:220px;display:flex;flex-direction:column}.head{display:flex;gap:12px;align-items:center}.icon{width:60px;height:60px;border-radius:15px;object-fit:cover;background:#1b2030}.name{font-weight:850;font-size:18px}.ver{font-size:11px;color:#8992a3;margin-top:3px}.desc{color:#aeb6c5;font-size:13px;line-height:1.5;white-space:pre-wrap;margin:13px 0;flex:1}.meta{font-size:11px;color:#7f899c;margin-bottom:10px}.download{display:block;text-align:center;background:linear-gradient(135deg,#6757ff,#1baeea);padding:12px;border-radius:12px;font-weight:800;color:white;text-decoration:none}.empty{border:1px dashed #2b3240;border-radius:18px;padding:35px 20px;text-align:center;color:#8e97a8}.empty b{display:block;color:#e8ebf2;margin-bottom:6px}footer{text-align:center;color:#666f80;font-size:11px;padding:30px 0 10px}@media(max-width:550px){.admin{display:none}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><div class="brand"><div class="logo">GBZ</div><div><div class="title">Ghassan Bin Zia App Store</div><div class="sub">Official app downloads</div></div></div><a class="admin" href="admin.html">Admin</a></header><section class="hero"><h2>My Apps</h2><p>Only applications actually published by the owner appear here.</p><input id="search" class="search" placeholder="Search apps…"></section><div id="status" class="status">Loading…</div><main id="apps" class="grid"></main><footer>Developed by Ghassan Bin Zia</footer></div><script>
let apps=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(list){let b=document.getElementById('apps');document.getElementById('status').textContent=list.length+' published app'+(list.length==1?'':'s');if(!list.length){b.innerHTML='<div class="empty"><b>No apps published yet</b>The store is empty until the owner adds an app.</div>';return}b.innerHTML=list.map(a=>'<article class="card"><div class="head"><img class="icon" src="'+esc(a.icon||'')+'" onerror="this.style.visibility=\'hidden\'"><div><div class="name">'+esc(a.name)+'</div><div class="ver">'+esc(a.version||'Version not specified')+'</div></div></div><div class="desc">'+esc(a.description||'No description provided.')+'</div><div class="meta">'+esc(a.category||'App')+' · '+esc(a.size||'')+'</div><a class="download" href="'+esc(a.apk)+'" download>Download APK</a></article>').join('')}
async function load(){try{let r=await fetch('apps/apps.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;apps=await r.json();if(!Array.isArray(apps))apps=[];render(apps)}catch(e){document.getElementById('status').textContent='Store data unavailable';document.getElementById('apps').innerHTML='<div class="empty"><b>Could not load the catalogue</b>Please try again later.</div>'}}
document.getElementById('search').oninput=e=>{let q=e.target.value.toLowerCase();render(apps.filter(a=>(a.name+' '+(a.description||'')+' '+(a.category||'')).toLowerCase().includes(q)))};load();
</script></body></html>
